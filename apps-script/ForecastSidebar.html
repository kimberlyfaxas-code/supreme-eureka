<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; padding: 14px; }
      h2 { margin: 0 0 10px 0; }
      .btn {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      .primary { background:#0B2A4A; color:#fff; }
      .secondary { background:#1f6feb; color:#fff; }
      .tertiary { background:#E9EEF5; color:#0B2A4A; }
      .note { font-size: 12px; color:#444; margin-top: 10px; line-height: 1.35; }
    </style>
  </head>
  <body>
    <h2>Forecast Tools</h2>
    <button class="btn primary" onclick="run('FT_openOtcDrill')">OTC Data (selected row)</button>
    <button class="btn secondary" onclick="run('FT_openContractDrill')">Contract Details (selected row)</button>
    <button class="btn tertiary" onclick="run('FT_buildDashboards')">Build Dashboards</button>
    <div class="note">
      Tip: Click a row in <b>CSM_Working_Forecast</b>, then run a drill.<br>
      Dashboards summarize FY2026 retention and can be filtered by Product/CSM.
    </div>
    <script>
      function run(fn){
        google.script.run
          .withFailureHandler(err => alert(err.message || err))
          [fn]();
      }
    </script>
  </body>
</html>
